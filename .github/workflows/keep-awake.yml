# Supabase pauses free projects after a week with no activity.
# This pings the database every 3 days so it stays awake until the wedding.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping database
        run: |
          URL=$(grep -oP "supabaseUrl:\s*'\K[^']+" config.js)
          KEY=$(grep -oP "supabaseKey:\s*'\K[^']+" config.js)
          curl -fsS -X POST "$URL/rest/v1/rpc/ping" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
