<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Wedding admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Josefin+Sans:wght@400;600&family=Lora:wght@400;600&display=swap">
<link rel="stylesheet" href="style.css">
<style>
  body { font-size: 16px; }
  .wrap { max-width: 900px; }
  .top { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--paper); z-index: 5; }
  .top .script { font-size: 30px; }
  .login { max-width: 380px; margin: 60px auto; text-align: center; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: 18px 0; }
  .stat { background: var(--paper-2); border-radius: 12px; padding: 12px 14px; }
  .stat b { display: block; font-size: 26px; font-family: var(--body); }
  .stat span { font-size: 13px; color: var(--ink-soft); }
  .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
  .filters input { grid-column: 1 / -1; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; align-items: center; }
  .hh { background: #fff; border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; margin: 10px 0; }
  .hh h3 { margin: 0; font-size: 17px; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .meta { font-size: 13px; color: var(--ink-soft); margin: 2px 0 8px; }
  .badge { font-family: var(--caps); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; background: var(--paper-2); white-space: nowrap; }
  .badge.replied { background: #DCEBDD; color: var(--good); }
  .badge.opened { background: #F5E8C8; color: #6B4F12; }
  .badge.sent { background: #E3E7F2; color: #2D3D6B; }
  .badge.check { background: #F3D9D9; color: var(--bad); }
  .ppl { list-style: none; padding: 0; margin: 0 0 10px; font-size: 15px; }
  .ppl li { padding: 2px 0; }
  .ppl .y { color: var(--good); } .ppl .n { color: var(--bad); } .ppl .q { color: var(--ink-soft); }
  .acts { display: flex; gap: 6px; flex-wrap: wrap; }
  .modal { position: fixed; inset: 0; background: rgba(20,20,20,.5); z-index: 30; overflow: auto; padding: 16px; }
  .sheet { background: var(--paper); max-width: 640px; margin: 0 auto; border-radius: 16px; padding: 18px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
  .g-row { background: #fff; border: 1.5px solid var(--line); border-radius: 12px; padding: 8px 10px; margin: 8px 0; }
  .g-row .grid2 .field { margin: 6px 0; }
  .check-row { display: flex; align-items: center; gap: 10px; min-height: 44px; }
  .check-row input { width: 22px; height: 22px; }
  details { background: var(--paper-2); border-radius: 12px; padding: 10px 14px; margin: 12px 0; }
  summary { cursor: pointer; font-weight: 600; min-height: 32px; }
  .count { color: var(--ink-soft); font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">

  <section id="login" class="login hidden">
    <p class="script" style="font-size:44px;margin:0">Paula &amp; Doug</p>
    <p class="caps muted">Wedding admin</p>
    <form id="login-form">
      <label class="field"><span>Email</span><input type="email" id="email" autocomplete="username" required></label>
      <label class="field"><span>Password</span><input type="password" id="password" autocomplete="current-password" required></label>
      <p id="login-error" class="hidden" style="color:var(--bad)"></p>
      <button class="btn" type="submit" style="width:100%">Sign in</button>
    </form>
  </section>

  <section id="app" class="hidden">
    <div class="top">
      <span class="script">Wedding admin</span>
      <button class="btn ghost small" id="logout">Sign out</button>
    </div>

    <div class="stats" id="stats"></div>

    <details id="gift-box">
      <summary>Gift bank details</summary>
      <label class="field"><span>Account name</span><input type="text" id="s-name"></label>
      <div class="grid2">
        <label class="field"><span>Sort code</span><input type="text" id="s-sort" inputmode="numeric"></label>
        <label class="field"><span>Account number</span><input type="text" id="s-acc" inputmode="numeric"></label>
      </div>
      <button class="btn small" id="s-save">Save bank details</button>
      <p class="muted" style="font-size:14px">Guests only see these on their own personal invitation.</p>
    </details>

    <div class="filters">
      <input type="search" id="f-search" placeholder="Search names…">
      <select id="f-priority"></select>
      <select id="f-type"><option value="">All invites</option><option value="ceremony">Ceremony</option><option value="garden">Garden party</option></select>
      <select id="f-status"><option value="">Any status</option><option value="notsent">Not sent</option><option value="sent">Sent, not opened</option><option value="opened">Opened, no reply</option><option value="replied">Replied</option><option value="check">Names to check</option></select>
      <select id="f-sort"><option value="priority">Sort: priority</option><option value="name">Sort: name</option><option value="recent">Sort: latest reply</option></select>
    </div>
    <div class="bar">
      <button class="btn small" id="add">+ Add household</button>
      <button class="btn ghost small" id="export">Export CSV</button>
      <button class="btn ghost small" id="reload">Refresh</button>
      <span class="count" id="count"></span>
    </div>
    <div id="list"></div>
  </section>
</div>

<div class="modal hidden" id="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">
  <div class="sheet">
    <h3 id="m-title" style="margin-top:0">Edit household</h3>
    <label class="field"><span>Household name (only you see this)</span><input type="text" id="m-name"></label>
    <div class="grid2">
      <label class="field"><span>Priority / round</span><input type="text" id="m-priority"></label>
      <label class="field"><span>Invite</span><select id="m-type"><option value="ceremony">Ceremony (3pm)</option><option value="garden">Garden party (3.30pm)</option></select></label>
    </div>
    <label class="field"><span>Category</span><input type="text" id="m-category" list="cats"></label>
    <datalist id="cats"></datalist>
    <label class="check-row"><input type="checkbox" id="m-plusone"> Allowed a plus one</label>
    <label class="field"><span>Notes (only you see this)</span><textarea id="m-notes"></textarea></label>
    <h4 style="margin:16px 0 4px">People</h4>
    <div id="m-guests"></div>
    <button class="btn ghost small" id="m-addguest" type="button">+ Add person</button>
    <p id="m-link" class="muted" style="font-size:14px;word-break:break-all"></p>
    <div class="bar" style="justify-content:space-between;margin-top:18px">
      <button class="btn ghost small" id="m-delete" type="button" style="color:var(--bad);border-color:var(--bad)">Delete</button>
      <span style="display:flex;gap:8px">
        <button class="btn ghost small" id="m-cancel" type="button">Cancel</button>
        <button class="btn small" id="m-save" type="button">Save</button>
      </span>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="config.js"></script>
<script>
(function () {
  const C = window.WEDDING_CONFIG;
  const $ = (id) => document.getElementById(id);
  const STORE = 'wedding-admin-session';
  let session = null, data = { invites: [], settings: {} }, editing = null;

  // ---------- auth + api ----------
  const load = () => { try { return JSON.parse(localStorage.getItem(STORE)); } catch (e) { return null; } };
  const save = (s) => { session = s; try { s ? localStorage.setItem(STORE, JSON.stringify(s)) : localStorage.removeItem(STORE); } catch (e) {} };
  async function auth(grant, body) {
    const r = await fetch(C.supabaseUrl + '/auth/v1/token?grant_type=' + grant, {
      method: 'POST', headers: { 'Content-Type': 'application/json', apikey: C.supabaseKey }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error_description || j.msg || 'Sign in failed');
    return { access_token: j.access_token, refresh_token: j.refresh_token };
  }
  async function rpc(fn, body, retried) {
    const r = await fetch(C.supabaseUrl + '/rest/v1/rpc/' + fn, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: C.supabaseKey, Authorization: 'Bearer ' + session.access_token },
      body: JSON.stringify(body || {}) });
    if (r.status === 401 && !retried && session.refresh_token) {
      try { save(await auth('refresh_token', { refresh_token: session.refresh_token })); return rpc(fn, body, true); }
      catch (e) { signedOut(); throw e; }
    }
    const text = await r.text();
    if (!r.ok) { if (/Not authorised/.test(text)) { signedOut('This account is not set up as an admin.'); } throw new Error(text); }
    return text ? JSON.parse(text) : null;
  }
  function signedOut(msg) {
    save(null); $('app').classList.add('hidden'); $('login').classList.remove('hidden');
    if (msg) { $('login-error').textContent = msg; $('login-error').classList.remove('hidden'); }
  }
  $('login-form').addEventListener('submit', async (e) => {
    e.preventDefault(); $('login-error').classList.add('hidden');
    try { save(await auth('password', { email: $('email').value.trim(), password: $('password').value })); $('password').value = ''; start(); }
    catch (err) { $('login-error').textContent = 'Email or password not recognised.'; $('login-error').classList.remove('hidden'); }
  });
  $('logout').addEventListener('click', () => {
    fetch(C.supabaseUrl + '/auth/v1/logout', { method: 'POST', headers: { apikey: C.supabaseKey, Authorization: 'Bearer ' + session.access_token } }).catch(() => {});
    signedOut();
  });

  // ---------- helpers ----------
  function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1800); }
  function el(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    for (const k in (attrs || {})) { if (k === 'class') e.className = attrs[k]; else if (k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]); else if (attrs[k] !== undefined && attrs[k] !== null) e.setAttribute(k, attrs[k]); }
    kids.forEach((k) => k != null && e.append(k));
    return e;
  }
  const link = (i) => C.siteUrl + '?g=' + i.code;
  const live = (i) => i.priority !== 'x';
  const PLACEHOLDER = /\?|^(hubby|missus|wife|fella|partner|child|kid|bird|plus one)$/i;
  const needsCheck = (i) => i.guests.some((g) => PLACEHOLDER.test(g.name.trim()) || (g.age_group !== 'adult' && g.age == null));
  function status(i) {
    if (i.responded_at) return ['replied', 'Replied'];
    if (i.first_opened_at) return ['opened', 'Opened'];
    if (i.sent_at) return ['sent', 'Sent'];
    return ['', 'Not sent'];
  }
  const firstNames = (i) => { const a = i.guests.filter((g) => !g.is_plus_one && g.age_group === 'adult').map((g) => g.name.split(' ')[0].replace('?', '')); return a.length < 2 ? (a[0] || '') : a.slice(0, -1).join(', ') + ' & ' + a[a.length - 1]; };
  const prioNum = (p) => (/^[0-9.]+$/.test(p || '') ? parseFloat(p) : 999);

  // ---------- data ----------
  async function start() {
    $('login').classList.add('hidden'); $('app').classList.remove('hidden');
    try { data = await rpc('admin_data'); } catch (e) { if (session) toast('Could not load the guest list'); return; }
    const pr = [...new Set(data.invites.map((i) => i.priority || ''))].sort((a, b) => prioNum(a) - prioNum(b));
    const fp = $('f-priority'), keep = fp.value; fp.innerHTML = '';
    fp.append(el('option', { value: '' }, 'All rounds'));
    pr.forEach((p) => fp.append(el('option', { value: p }, p === 'x' ? 'Round x (not inviting)' : 'Round ' + (p || '–'))));
    fp.value = keep;
    $('cats').innerHTML = ''; [...new Set(data.invites.map((i) => i.category).filter(Boolean))].sort().forEach((c) => $('cats').append(el('option', { value: c })));
    $('s-name').value = data.settings.gift_account_name || ''; $('s-sort').value = data.settings.gift_sort_code || ''; $('s-acc').value = data.settings.gift_account_number || '';
    render();
  }

  function render() {
    const inv = data.invites.filter(live);
    const people = inv.flatMap((i) => i.guests);
    const slots = inv.reduce((n, i) => n + i.guests.filter((g) => !g.is_plus_one).length + (i.plus_one_allowed ? 1 : 0), 0);
    const coming = people.filter((g) => g.attending === true);
    const cerSlots = inv.filter((i) => i.invite_type === 'ceremony').reduce((n, i) => n + i.guests.filter((g) => !g.is_plus_one).length + (i.plus_one_allowed ? 1 : 0), 0);
    const stats = [
      [slots, 'invited (incl. plus ones)'], [cerSlots, 'at the ceremony'],
      [inv.filter((i) => i.responded_at).length + ' / ' + inv.length, 'households replied'],
      [coming.length, 'coming'],
      [coming.filter((g) => g.age_group === 'adult').length + ' · ' + coming.filter((g) => g.age_group === 'teen').length + ' · ' + coming.filter((g) => g.age_group === 'child').length, 'adults · teens · children'],
      [people.filter((g) => g.attending === false).length, "can't make it"],
      [coming.filter((g) => g.dietary).length, 'dietary needs']
    ];
    $('stats').innerHTML = ''; stats.forEach(([b, s]) => $('stats').append(el('div', { class: 'stat' }, el('b', {}, String(b)), el('span', {}, s))));

    const q = $('f-search').value.trim().toLowerCase(), fp = $('f-priority').value, ft = $('f-type').value, fs = $('f-status').value, so = $('f-sort').value;
    let rows = data.invites.filter((i) => {
      if (fp && (i.priority || '') !== fp) return false;
      if (ft && i.invite_type !== ft) return false;
      const st = status(i)[0];
      if (fs === 'notsent' && st !== '') return false;
      if (fs === 'sent' && st !== 'sent') return false;
      if (fs === 'opened' && st !== 'opened') return false;
      if (fs === 'replied' && st !== 'replied') return false;
      if (fs === 'check' && !needsCheck(i)) return false;
      if (q && !(i.household_name + ' ' + i.guests.map((g) => g.name).join(' ') + ' ' + (i.category || '')).toLowerCase().includes(q)) return false;
      return true;
    });
    if (so === 'name') rows.sort((a, b) => a.household_name.localeCompare(b.household_name));
    else if (so === 'recent') rows.sort((a, b) => String(b.responded_at || '').localeCompare(String(a.responded_at || '')));
    else rows.sort((a, b) => prioNum(a.priority) - prioNum(b.priority));
    $('count').textContent = rows.length + ' households';

    const list = $('list'); list.innerHTML = '';
    rows.forEach((i) => {
      const [cls, label] = status(i);
      const ppl = el('ul', { class: 'ppl' });
      i.guests.forEach((g) => {
        const mark = g.attending === true ? ['y', '✓'] : g.attending === false ? ['n', '✗'] : ['q', '·'];
        ppl.append(el('li', {}, el('span', { class: mark[0] }, mark[1] + ' '), g.name,
          g.is_plus_one ? ' (plus one)' : '', g.age_group !== 'adult' ? ' (' + g.age_group + (g.age != null ? ', ' + g.age : '') + ')' : '',
          g.dietary ? el('span', { class: 'muted' }, ' · ' + g.dietary) : null));
      });
      if (i.plus_one_allowed && !i.guests.some((g) => g.is_plus_one)) ppl.append(el('li', { class: 'muted' }, '+ plus one allowed'));
      const card = el('div', { class: 'hh' },
        el('h3', {}, el('span', {}, i.household_name), el('span', { style: 'display:flex;gap:4px' }, needsCheck(i) ? el('span', { class: 'badge check' }, 'Check') : null, el('span', { class: 'badge ' + cls }, label))),
        el('div', { class: 'meta' }, 'Round ' + (i.priority || '–') + ' · ' + (i.invite_type === 'ceremony' ? 'Ceremony' : 'Garden party') + (i.category ? ' · ' + i.category : '')),
        ppl,
        i.message ? el('p', { style: 'margin:0 0 10px;font-style:italic' }, '“' + i.message + '”') : null,
        i.notes ? el('p', { class: 'muted', style: 'margin:0 0 10px;font-size:14px' }, 'Note: ' + i.notes) : null,
        el('div', { class: 'acts' },
          el('button', { class: 'btn small', onclick: () => openEdit(i) }, 'Edit'),
          el('button', { class: 'btn ghost small', onclick: () => share(i, 'copy') }, 'Copy link'),
          el('button', { class: 'btn ghost small', onclick: () => share(i, 'whatsapp') }, 'WhatsApp'),
          el('button', { class: 'btn ghost small', onclick: () => markSent(i, !i.sent_at) }, i.sent_at ? 'Mark not sent' : 'Mark sent')));
      list.append(card);
    });
  }
  ['f-search', 'f-priority', 'f-type', 'f-status', 'f-sort'].forEach((id) => $(id).addEventListener('input', render));
  $('reload').addEventListener('click', start);

  function replaceInvite(saved) { const k = data.invites.findIndex((x) => x.id === saved.id); if (k >= 0) data.invites[k] = saved; else data.invites.push(saved); render(); }
  async function markSent(i, sent) { replaceInvite(await rpc('admin_mark_sent', { p_id: i.id, p_sent: sent })); }
  function share(i, how) {
    const msg = 'Hi ' + firstNames(i) + '! We’re getting married 🥂 Here’s your invitation, with all the details and where to RSVP:\n' + link(i) + '\n\nPaula & Doug x';
    if (how === 'copy') { navigator.clipboard.writeText(msg).then(() => toast('Message and link copied')); }
    else { window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank', 'noopener'); }
    if (!i.sent_at) markSent(i, true).catch(() => {});
  }

  // ---------- edit ----------
  function guestRow(g) {
    const name = el('input', { type: 'text', value: g.name || '', 'data-k': 'name' });
    const grp = el('select', { 'data-k': 'age_group' }, ...['adult', 'teen', 'child'].map((v) => el('option', { value: v }, v[0].toUpperCase() + v.slice(1))));
    grp.value = g.age_group || 'adult';
    const age = el('input', { type: 'number', min: '0', max: '17', inputmode: 'numeric', value: g.age ?? '', 'data-k': 'age' });
    const att = el('select', { 'data-k': 'attending' }, el('option', { value: '' }, 'No reply'), el('option', { value: 'true' }, 'Coming'), el('option', { value: 'false' }, "Can't make it"));
    att.value = g.attending == null ? '' : String(g.attending);
    const diet = el('input', { type: 'text', value: g.dietary || '', 'data-k': 'dietary' });
    const row = el('div', { class: 'g-row', 'data-id': g.id || '', 'data-po': g.is_plus_one ? '1' : '' },
      el('label', { class: 'field' }, el('span', {}, g.is_plus_one ? 'Plus one name' : 'Name'), name),
      el('div', { class: 'grid2' },
        el('label', { class: 'field' }, el('span', {}, 'Age group'), grp),
        el('label', { class: 'field' }, el('span', {}, 'Age (under 18s)'), age),
        el('label', { class: 'field' }, el('span', {}, 'Reply'), att),
        el('label', { class: 'field' }, el('span', {}, 'Dietary'), diet)),
      el('button', { type: 'button', class: 'btn ghost small', onclick: () => row.remove() }, 'Remove'));
    return row;
  }
  function openEdit(i) {
    editing = i || { id: '', household_name: '', priority: '', invite_type: 'garden', category: '', plus_one_allowed: false, notes: '', guests: [] };
    $('m-title').textContent = i ? 'Edit household' : 'Add household';
    $('m-name').value = editing.household_name; $('m-priority').value = editing.priority || ''; $('m-type').value = editing.invite_type;
    $('m-category').value = editing.category || ''; $('m-plusone').checked = !!editing.plus_one_allowed; $('m-notes').value = editing.notes || '';
    $('m-guests').innerHTML = ''; (editing.guests.length ? editing.guests : [{}]).forEach((g) => $('m-guests').append(guestRow(g)));
    $('m-link').textContent = i ? 'Link: ' + link(i) : '';
    $('m-delete').classList.toggle('hidden', !i);
    $('modal').classList.remove('hidden'); $('m-name').focus();
  }
  $('add').addEventListener('click', () => openEdit(null));
  $('m-addguest').addEventListener('click', () => $('m-guests').append(guestRow({})));
  $('m-cancel').addEventListener('click', () => $('modal').classList.add('hidden'));
  $('m-save').addEventListener('click', async () => {
    const guests = [...$('m-guests').children].map((r) => {
      const v = (k) => r.querySelector('[data-k=' + k + ']').value.trim();
      return { id: r.dataset.id, is_plus_one: !!r.dataset.po, name: v('name'), age_group: v('age_group'), age: v('age'),
               attending: v('attending') === '' ? null : v('attending') === 'true', dietary: v('dietary') };
    }).filter((g) => g.name);
    const name = $('m-name').value.trim() || (guests[0] && guests[0].name);
    if (!name) { toast('Add at least one name'); return; }
    const btn = $('m-save'); btn.disabled = true;
    try {
      replaceInvite(await rpc('admin_save_invite', { p: { id: editing.id, household_name: name, priority: $('m-priority').value.trim(),
        invite_type: $('m-type').value, category: $('m-category').value.trim(), plus_one_allowed: $('m-plusone').checked,
        notes: $('m-notes').value.trim(), guests } }));
      $('modal').classList.add('hidden'); toast('Saved');
    } catch (e) { toast('Could not save'); } finally { btn.disabled = false; }
  });
  $('m-delete').addEventListener('click', async () => {
    if (!editing.id) return;
    const btn = $('m-delete');
    if (btn.dataset.confirm !== '1') { btn.dataset.confirm = '1'; btn.textContent = 'Tap again to delete'; setTimeout(() => { btn.dataset.confirm = ''; btn.textContent = 'Delete'; }, 3000); return; }
    await rpc('admin_delete_invite', { p_id: editing.id });
    data.invites = data.invites.filter((x) => x.id !== editing.id); render();
    $('modal').classList.add('hidden'); btn.dataset.confirm = ''; btn.textContent = 'Delete'; toast('Deleted');
  });
  $('s-save').addEventListener('click', async () => {
    await rpc('admin_save_settings', { p: { gift_account_name: $('s-name').value.trim(), gift_sort_code: $('s-sort').value.trim(), gift_account_number: $('s-acc').value.trim() } });
    toast('Bank details saved');
  });

  // ---------- export ----------
  $('export').addEventListener('click', () => {
    const esc = (v) => '"' + String(v ?? '').replace(/"/g, '""') + '"';
    const lines = [['Round', 'Household', 'Invite', 'Category', 'Name', 'Plus one', 'Age group', 'Age', 'Reply', 'Dietary', 'Message', 'Replied at', 'Link'].map(esc).join(',')];
    data.invites.forEach((i) => i.guests.forEach((g) => lines.push([i.priority, i.household_name, i.invite_type, i.category, g.name, g.is_plus_one ? 'yes' : '', g.age_group, g.age,
      g.attending == null ? 'No reply' : g.attending ? 'Coming' : "Can't make it", g.dietary, i.message, i.responded_at, link(i)].map(esc).join(','))));
    const a = el('a', { href: URL.createObjectURL(new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv' })), download: 'wedding-guests.csv' });
    document.body.append(a); a.click(); a.remove();
  });

  session = load();
  if (session) start(); else $('login').classList.remove('hidden');
})();
</script>
</body>
</html>
